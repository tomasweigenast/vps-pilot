name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod

      - name: Build binary
        run: |
          GOOS=linux GOARCH=${{ matrix.arch }} CGO_ENABLED=0 go build \
            -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o vps-pilot \
            ./cmd/server

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Build .deb package
        working-directory: deploy
        run: |
          VERSION=${{ github.ref_name }} ARCH=${{ matrix.arch }} nfpm package \
            --config nfpm.yaml \
            --packager deb \
            --target ../dist/

      - name: Build .apk package
        working-directory: deploy
        run: |
          VERSION=${{ github.ref_name }} ARCH=${{ matrix.arch }} nfpm package \
            --config nfpm.yaml \
            --packager apk \
            --target ../dist/

      - name: Create binary tarball
        run: |
          tar -czf "dist/vps-pilot_${{ github.ref_name }}_linux_${{ matrix.arch }}.tar.gz" vps-pilot

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: packages-${{ matrix.arch }}
          path: dist/

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/download-artifact@v8.0.1
        with:
          path: dist/
          merge-multiple: true

      - name: Create GitHub Release
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "${{ github.ref_name }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
