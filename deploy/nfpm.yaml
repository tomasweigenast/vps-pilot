name: vps-pilot
arch: ${ARCH}
platform: linux
version: ${VERSION}
maintainer: Tomas Weigenast <tweigenast@gmail.com>
description: |
  Slim VPS management server for Docker Compose deployments.
  Single binary, systemd service, no runtime dependencies beyond Docker CLI.
license: MIT
homepage: https://github.com/tomasweigenast/vps-pilot

contents:
  - src: ../vps-pilot
    dst: /usr/local/bin/vps-pilot
    file_info:
      mode: 0755

  - src: vps-pilot.service
    dst: /lib/systemd/system/vps-pilot.service

scripts:
  postinstall: scripts/postinstall.sh
  preremove: scripts/preremove.sh
